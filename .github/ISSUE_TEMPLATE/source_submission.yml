name: 资料入库申请
description: 提交新的化工资料元数据或申请处理一个明确范围
title: "[Source] "
body:
  - type: markdown
    attributes:
      value: |
        不要上传 PDF、扫描页、OCR 全文或大段原文。只填写书目、哈希、页数、权限和计划范围。
  - type: input
    id: title
    attributes:
      label: 资料题名与版本
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: 取得渠道与来源核对方式
      description: 只写可公开的渠道、书目信息或来源页面；不填本机路径、私密链接。尚未核实可明确说明。
    validations:
      required: true
  - type: input
    id: pages
    attributes:
      label: PDF 总页数
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: 文件 SHA-256
      description: 只填写哈希，不上传文件。
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: 顶层主题
      options:
        - 化工原理 / chemical-engineering-principles
        - 反应工程 / reaction-engineering
        - 同时涉及两者（在处理范围中分别说明）
        - 尚不确定，请维护者协助归类
    validations:
      required: true
  - type: dropdown
    id: rights
    attributes:
      label: 权限状态
      options:
        - 自有原创或明确可公开授权
        - 已获授权但需私下核验
        - 仅本地研究，不允许公开载荷
        - 尚不明确
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 计划处理范围
      description: 请写章节、页段、对象类型和预期输出。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我不会在公开 Issue 中上传受版权保护的源文件或可重建内容。
          required: true
